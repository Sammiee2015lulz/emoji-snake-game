<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Emoji Snake - Fun Cool Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ff88;
            background: #0f0f23;
        }
        h1 {
            margin: 10px;
            text-shadow: 0 0 10px #00ff88;
        }
        #score {
            font-size: 1.5em;
            margin: 10px;
            color: #00ff88;
        }
        #message {
            margin: 10px;
            font-size: 1.2em;
            height: 30px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00cc66;
        }
    </style>
</head>
<body>
    <h1>🐍 Emoji Snake</h1>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="message">Use Arrow Keys or WASD to move! Eat the emojis!</div>
    <button onclick="restartGame()">Restart</button>
    <p>Made with 💖 - A fun cool daily game!</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const messageEl = document.getElementById('message');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let dx = 0;
        let dy = 0;
        let food = {x: 15, y: 15};
        let score = 0;
        let gameSpeed = 150;
        let gameInterval;
        let gameRunning = false;

        const emojis = ['🍎', '🍊', '🍋', '🍌', '🍉', '🥭', '🍑', '🍒', '🍓', '🍇'];
        let currentEmoji = emojis[0];

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            currentEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            // Avoid snake body
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    randomFood();
                    return;
                }
            }
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw food
            ctx.font = `${gridSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(currentEmoji, food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2);

            // Draw snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#00ff88' : '#00cc66';
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                if (index === 0) {
                    // Eyes
                    ctx.fillStyle = '#000';
                    ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 4, 4, 4);
                    ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 4, 4, 4);
                }
            });
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = `Score: ${score}`;
                randomFood();
                // Speed up a bit
                if (gameSpeed > 50) gameSpeed -= 5;
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, gameSpeed);
            } else {
                snake.pop();
            }
        }

        function gameLoop() {
            if (!gameRunning) return;
            moveSnake();
            draw();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            messageEl.textContent = `Game Over! Final Score: ${score}. Press Restart!`;
            messageEl.style.color = '#ff4444';
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            gameSpeed = 150;
            scoreEl.textContent = 'Score: 0';
            messageEl.textContent = 'Eat the emojis! Arrow keys or WASD';
            messageEl.style.color = '#eee';
            randomFood();
            gameRunning = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
            draw();
        }

        function restartGame() {
            startGame();
        }

        document.addEventListener('keydown', (e) => {
            if (!gameRunning && e.key !== 'Enter') return;
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        });

        // Start on load
        window.onload = startGame;
    </script>
</body>
</html>
